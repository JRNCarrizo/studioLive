[build]
  publish = "website"
  functions = "netlify/functions"

# Descarga directa desde tu dominio → redirige al .exe del último Release (sin UI de GitHub).
[[redirects]]
  from = "/download"
  to = "/.netlify/functions/download"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
