<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#100e0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Studio Live — Cámara</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Bahnschrift, "Segoe UI", sans-serif;
        background: #070605;
        color: #efe6d6;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070605;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      /* Escena fija: toda la pantalla */
      .stage {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        max-width: 100%;
        overflow: hidden;
        background: #000;
        z-index: 0;
      }
      /* Importante: pantalla completa debe ser .stage (vídeo + HUD), no solo el <video>, si no los botones dejan de recibir toques en Android. */
      .stage:fullscreen,
      .stage:-webkit-full-screen {
        background: #000;
      }
      #pv {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
      .finder {
        position: absolute;
        top: 58px;
        right: 14px;
        bottom: 236px;
        left: 14px;
        z-index: 2;
        pointer-events: none;
      }
      .finder span {
        position: absolute;
        width: 28px;
        height: 28px;
        border: 2px solid rgba(255, 214, 150, 0.55);
      }
      .finder span:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
      .finder span:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
      .finder span:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
      .finder span:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
      .stage[data-air='live'] .finder span {
        border-color: rgba(255, 48, 48, 0.9);
      }
      .status-bar {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 48px;
        padding: 10px 14px;
        padding-top: max(10px, env(safe-area-inset-top));
        box-sizing: border-box;
        background: linear-gradient(to bottom, rgba(8, 6, 4, 0.92) 0%, rgba(8, 6, 4, 0.2) 100%);
        pointer-events: none;
      }
      .brand {
        letter-spacing: 0.22em;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        color: #f3eadc;
      }
      .tally {
        position: static;
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 7px;
        letter-spacing: 0.16em;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: #ffb020;
      }
      .tally[data-state='wait'] i {
        background: #c9842a;
        box-shadow: 0 0 8px #c9842a;
      }
      .tally i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #3a3228;
        box-shadow: inset 0 1px 2px #000;
        font-style: normal;
      }
      .tally[data-state='stby'] i {
        background: #ffb020;
        box-shadow: 0 0 8px #ffb020;
      }
      .tally[data-state='live'] {
        color: #ffd0c8;
      }
      .tally[data-state='live'] i {
        background: #ff2a2a;
        box-shadow: 0 0 10px #ff2a2a;
        animation: tally-pulse 1s steps(2, end) infinite;
      }
      .tally[data-state='fault'] i {
        background: #ffb020;
        box-shadow: 0 0 8px #ffb020;
      }
      @keyframes tally-pulse {
        50% { opacity: 0.35; }
      }
      /* Sin stream todavía: mensaje centrado */
      .splash {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        z-index: 1;
        pointer-events: none;
      }
      .splash-card {
        padding: 16px 18px;
        border: 1px solid #3a3228;
        background: rgba(16, 14, 12, 0.72);
        box-shadow: inset 0 1px 0 rgba(255, 236, 210, 0.12);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
        color: #b7a894;
      }
      .splash strong {
        display: block;
        margin-bottom: 6px;
        color: #f3eadc;
        letter-spacing: 0.18em;
        font-size: 13px;
      }
      .splash.hidden {
        opacity: 0;
        visibility: hidden;
      }
      /* Placa de controles, como el lateral de una cámara de cine. */
      .hud {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        z-index: 3;
        padding: 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
        background:
          linear-gradient(180deg, rgba(36, 31, 26, 0.96) 0%, rgba(16, 14, 12, 0.98) 100%);
        border-top: 1px solid #000;
        box-shadow: inset 0 1px 0 rgba(255, 236, 210, 0.14);
      }
      .hud-row {
        display: flex;
        gap: 8px;
        align-items: stretch;
        width: 100%;
        min-width: 0;
      }
      .hud-cams {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        width: 100%;
        max-width: 100%;
      }
      .hud-cams > button {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
      }
      button {
        appearance: none;
        -webkit-appearance: none;
        -webkit-tap-highlight-color: transparent;
        min-height: 54px;
        padding: 8px 6px;
        border-radius: 3px;
        border: 1px solid #4a4034;
        background: linear-gradient(180deg, #3d352c 0%, #221c16 100%);
        color: #f4eadc;
        box-shadow:
          inset 0 1px 0 rgba(255, 244, 220, 0.22),
          0 2px 0 #000;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45);
      }
      .led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2a241c;
        box-shadow: inset 0 1px 2px #000;
        font-style: normal;
      }
      .cam-pick.active {
        border-color: #6a542c;
        color: #fff6e8;
        background: linear-gradient(180deg, #4a3b22 0%, #241c10 100%);
      }
      .cam-pick.active .led {
        background: #ffb020;
        box-shadow: 0 0 8px #ffb020;
      }
      #torchBtn.lamp-on {
        border-color: #6a542c;
        color: #fff6e8;
      }
      #torchBtn.lamp-on .led {
        background: #fff1c2;
        box-shadow: 0 0 10px #ffe7a0;
      }
      button:disabled {
        opacity: 0.42;
      }
      /* Linterna: aunque no haya API torch, el botón puede intentar encenderla — no usar aspecto “fantasma”. */
      #torchBtn.torch-unavailable {
        opacity: 0.92;
      }
      .zoom-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 10px;
        padding: 10px 2px 8px;
      }
      .zoom-mark,
      #zoomReadout {
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #8d7d68;
      }
      #zoomReadout {
        min-width: 52px;
        text-align: right;
        font-family: Consolas, "Cascadia Mono", ui-monospace, monospace;
        color: #ffb020;
        text-shadow: 0 0 8px rgba(255, 176, 32, 0.35);
      }
      #zoomSlider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        height: 28px;
        margin: 0;
        background: transparent;
        accent-color: #d7b07a;
      }
      #zoomSlider::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 1px;
        background: linear-gradient(90deg, #5c4e3c, #e7c48a 72%, #8a6230);
        box-shadow: inset 0 1px 2px #000;
      }
      #zoomSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 26px;
        margin-top: -11px;
        border-radius: 2px;
        border: 1px solid #6b5a40;
        background: linear-gradient(180deg, #f2e2c8 0%, #8d7352 45%, #3a2e22 100%);
        box-shadow: 0 1px 0 #000, inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }
      #zoomSlider:disabled {
        opacity: 0.4;
      }
      .transport-row {
        display: grid;
        grid-template-columns: 78px minmax(0, 148px);
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding-top: 4px;
      }
      .transport-row #fsBtn {
        width: 100%;
        max-width: none;
      }
      #btn {
        flex: 0 0 78px;
        width: 78px;
        height: 78px;
        min-height: 78px;
        border-radius: 50%;
        border: 3px solid #3a3228;
        background: radial-gradient(circle at 38% 32%, #5a2420 0%, #1a0c0a 68%);
        color: #ffd0c8;
        letter-spacing: 0.16em;
        box-shadow:
          inset 0 2px 0 rgba(255, 190, 170, 0.28),
          0 3px 0 #000,
          0 10px 18px rgba(0, 0, 0, 0.45);
      }
      #btn .rec-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff2a2a;
        box-shadow: 0 0 8px #ff2a2a;
      }
      #btn.is-live {
        border-color: #ff6a5a;
        background: radial-gradient(circle at 38% 32%, #ff5a48 0%, #8a120c 58%, #2a0806 100%);
        color: #fff;
        box-shadow:
          0 0 18px rgba(255, 40, 40, 0.55),
          inset 0 2px 0 rgba(255, 255, 255, 0.28),
          0 3px 0 #000;
      }
      pre#log {
        margin: 0 0 10px;
        max-height: 14vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: Consolas, "Cascadia Mono", ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.35;
        letter-spacing: 0.02em;
        text-transform: none;
        color: #c6a15a;
        background: #0a0908;
        border: 1px solid #000;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.65);
        padding: 6px 8px;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <video id="pv" autoplay playsinline muted></video>
      <div class="finder" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="status-bar">
        <span class="brand">Studio Live</span>
        <span class="tally" id="tally" data-state="wait"><i></i><span id="tallyText">Sync</span></span>
      </div>
      <div id="splash" class="splash">
        <div class="splash-card">
          <strong>Visor</strong>
          Pulsá REC para salir al aire
        </div>
      </div>
      <div class="hud">
        <pre id="log"></pre>
        <div class="hud-cams">
          <button type="button" id="camEnv" class="secondary cam-pick active" disabled title="Cámara trasera">
            <i class="led"></i>
            <span class="key-label">Tras</span>
          </button>
          <button type="button" id="camUser" class="secondary cam-pick" disabled title="Selfie / frontal">
            <i class="led"></i>
            <span class="key-label">Frente</span>
          </button>
          <button type="button" id="torchBtn" class="secondary" disabled title="Solo en muchos Android con cámara trasera">
            <i class="led"></i>
            <span class="key-label">Luz</span>
          </button>
        </div>
        <div class="hud-row zoom-row" id="zoomRow">
          <span class="zoom-mark">W</span>
          <input
            type="range"
            id="zoomSlider"
            disabled
            min="1"
            max="1"
            step="0.01"
            value="1"
            title="Si tu equipo lo permite (suele verse en Chrome/Android, cámara trasera)"
          />
          <span class="zoom-mark">T</span>
          <span id="zoomReadout">—</span>
        </div>
        <div class="hud-row transport-row">
          <button type="button" id="btn" disabled>
            <i class="rec-dot"></i>
            <span class="key-label">Sync</span>
          </button>
          <button type="button" id="fsBtn" class="secondary" title="Oculta barras del navegador si el sistema lo permite">
            <i class="led"></i>
            <span class="key-label">Visor</span>
          </button>
        </div>
      </div>
    </div>
    <script>
      const rtcConfig = { iceServers: [] }

      const logEl = document.getElementById('log')
      const btn = document.getElementById('btn')
      const fsBtn = document.getElementById('fsBtn')
      const camEnv = document.getElementById('camEnv')
      const camUser = document.getElementById('camUser')
      const torchBtn = document.getElementById('torchBtn')
      const stage = document.getElementById('stage')
      const pv = document.getElementById('pv')
      const splash = document.getElementById('splash')
      const zoomSlider = document.getElementById('zoomSlider')
      const zoomReadout = document.getElementById('zoomReadout')
      const tally = document.getElementById('tally')
      const tallyText = document.getElementById('tallyText')

      function setKeyLabel(el, text) {
        if (!el) return
        const cap = el.querySelector('.key-label')
        if (cap) cap.textContent = text
        else el.textContent = text
      }

      function setTally(state, text) {
        if (!tally) return
        tally.dataset.state = state
        if (tallyText) tallyText.textContent = text
      }

      function paintZoom(value) {
        if (!zoomReadout) return
        const n = Number(value)
        zoomReadout.textContent = Number.isFinite(n) ? n.toFixed(2) + '×' : '—'
      }

      /** `environment` = trasera, `user` = frontal (selfie). */
      let facingModePreference = 'environment'
      let torchOn = false

      function log(...args) {
        logEl.textContent = args.map(String).join(' ')
      }

      function ensureMediaDevicesShim() {
        if (typeof navigator === 'undefined') return false
        if (!navigator.mediaDevices) navigator.mediaDevices = {}
        if (typeof navigator.mediaDevices.getUserMedia === 'function') return true
        const legacy =
          navigator.getUserMedia ||
          navigator.webkitGetUserMedia ||
          navigator.mozGetUserMedia ||
          navigator.msGetUserMedia
        if (!legacy) return false
        navigator.mediaDevices.getUserMedia = function (constraints) {
          return new Promise(function (resolve, reject) {
            legacy.call(navigator, constraints, resolve, reject)
          })
        }
        return true
      }

      function checkSecureCameraContext() {
        if (location.protocol === 'https:') return true
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return true
        return false
      }

      /**
       * Pantalla completa del contenedor `.stage` (vídeo + controles). Si solo se hace fullscreen del `<video>`,
       * en Android los botones Trasera/Frontal/Linterna pueden quedar fuera del área táctil del fullscreen.
       */
      async function tryEnterFullscreen() {
        const candidates = [stage, pv].filter(Boolean)
        for (const el of candidates) {
          try {
            if (el.requestFullscreen) {
              await el.requestFullscreen()
              return
            }
            if (el.webkitRequestFullscreen) {
              await el.webkitRequestFullscreen()
              return
            }
          } catch (_) {
            /* probá el siguiente candidato */
          }
        }
        /* iOS Safari: suele existir solo en el elemento video */
        try {
          if (typeof pv.webkitEnterFullscreen === 'function') {
            pv.webkitEnterFullscreen()
          }
        } catch (_) {}
      }

      ensureMediaDevicesShim()

      const VIDEO_PRESETS = {
        isoMax: {
          width: { min: 1280, ideal: 1920 },
          height: { min: 720, ideal: 1080 },
          frameRate: { ideal: 30, min: 24, max: 30 }
        },
        high: {
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          frameRate: { ideal: 30, max: 30 }
        },
        medium: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 24, max: 30 }
        },
        low: {
          width: { ideal: 854 },
          height: { ideal: 480 },
          frameRate: { ideal: 24, max: 24 }
        }
      }

      /** Tope por preset para el codificador WebRTC (reduce tirones por congestión Wi‑Fi con varios celulares). */
      const PRESET_MAX_WEBRTC_BITRATE = {
        isoMax: 5_500_000,
        high: 3_000_000,
        medium: 1_600_000,
        low: 900_000
      }

      /** VP8 y H.264 se pueden guardar en la PC sin recomprimir. El resto queda detrás. */
      function preferPassthroughCodecs(pc) {
        const caps = RTCRtpSender.getCapabilities && RTCRtpSender.getCapabilities('video')
        if (!caps || !caps.codecs) return
        const codecs = []
        const want = ['video/vp8', 'video/h264', 'video/vp9', 'video/av1']
        const picked = new Set()
        for (const mime of want) {
          for (const c of caps.codecs) {
            if (String(c.mimeType || '').toLowerCase() !== mime || picked.has(c)) continue
            picked.add(c)
            codecs.push(c)
          }
        }
        for (const c of caps.codecs) {
          if (!picked.has(c)) codecs.push(c)
        }
        const transceiver = pc.getTransceivers().find((t) => t.sender && t.sender.track && t.sender.track.kind === 'video')
        if (!transceiver || typeof transceiver.setCodecPreferences !== 'function') return
        try {
          transceiver.setCodecPreferences(codecs)
        } catch (_) {}
      }

      async function forceKeyframe(peer) {
        const sender = peer && peer.getSenders().find((s) => s.track && s.track.kind === 'video')
        if (!sender || typeof sender.getParameters !== 'function') return
        try {
          const params = sender.getParameters()
          if (!params.encodings || !params.encodings.length) params.encodings = [{}]
          const enc = params.encodings[0]
          const prev = enc.scaleResolutionDownBy || 1
          enc.scaleResolutionDownBy = prev === 1 ? 1.01 : 1
          await sender.setParameters(params)
          enc.scaleResolutionDownBy = prev
          await sender.setParameters(params)
        } catch (_) {}
      }

      async function applyOutboundVideoBitrateCap(pc) {
        const q = new URLSearchParams(location.search).get('preset') || 'medium'
        const maxBitrate = PRESET_MAX_WEBRTC_BITRATE[q] ?? PRESET_MAX_WEBRTC_BITRATE.medium
        const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video')
        if (!sender || typeof sender.getParameters !== 'function') return
        try {
          const params = sender.getParameters()
          if (!params.encodings || !params.encodings.length) {
            params.encodings = [{}]
          }
          params.encodings[0].maxBitrate = maxBitrate
          await sender.setParameters(params)
        } catch (_) {
          /* Algunos builds ignoran o fallan hasta el primer keyframe. */
        }
      }

      /** Debe coincidir con la pestaña activa en la PC (`studioWorkspace=live` | `liveFusion`). */
      function studioWorkspaceFromSearch() {
        const q = new URLSearchParams(location.search).get('studioWorkspace')
        return q === 'liveFusion' ? 'liveFusion' : 'live'
      }

      function videoConstraintsFromPreset() {
        const q = new URLSearchParams(location.search).get('preset') || 'medium'
        const base = VIDEO_PRESETS[q] || VIDEO_PRESETS.medium
        return {
          facingMode: { ideal: facingModePreference },
          ...base
        }
      }

      function syncCamPickUi() {
        camEnv.classList.toggle('active', facingModePreference === 'environment')
        camUser.classList.toggle('active', facingModePreference === 'user')
      }

      /** Linterna: no deshabilitar solo porque getCapabilities no liste torch (Chrome a veces no lo declara hasta probar). */
      function updateTorchAvailability() {
        const vt = localStream?.getVideoTracks?.()[0]
        if (!vt || facingModePreference === 'user') {
          torchBtn.disabled = true
          torchBtn.classList.remove('torch-unavailable', 'lamp-on')
          if (torchOn && vt) {
            torchOn = false
            try {
              vt.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {})
            } catch (_) {}
          }
          setKeyLabel(torchBtn, 'Luz')
          torchBtn.title = 'Solo con cámara trasera'
          return
        }
        const caps = typeof vt.getCapabilities === 'function' ? vt.getCapabilities() : {}
        const reportsTorch = caps.torch === true || caps.torch === 'constant' || caps.torch === 'smooth'
        torchBtn.disabled = false
        torchBtn.classList.toggle('torch-unavailable', !reportsTorch)
        torchBtn.classList.toggle('lamp-on', torchOn)
        setKeyLabel(torchBtn, 'Luz')
        torchBtn.title = reportsTorch
          ? torchOn
            ? 'Apagar linterna'
            : 'Encender linterna (Android / Chrome)'
          : 'Probar linterna — en algunos equipos funciona aunque el navegador no la liste.'
      }

      async function setTorch(on) {
        const vt = localStream?.getVideoTracks?.()[0]
        if (!vt || facingModePreference === 'user') return
        try {
          await vt.applyConstraints({ advanced: [{ torch: !!on }] })
          torchOn = !!on
        } catch (e) {
          log('Linterna:', e?.message || e)
          torchOn = false
        }
        updateTorchAvailability()
      }

      /** Zoom: animación suavizada (el hardware a veces igual salta en escalones finos). */
      let zoomRafId = 0
      let zoomAnimGoal = null
      let zoomAnimGeneration = 0

      function cancelZoomAnimation() {
        zoomAnimGeneration++
        if (zoomRafId) {
          cancelAnimationFrame(zoomRafId)
          zoomRafId = 0
        }
        zoomAnimGoal = null
      }

      /**
       * Zoom por software vía MediaTrack (Chrome/Android en varios equipos; iPhone/Safari casi nunca).
       * https://developer.mozilla.org/en-US/docs/Web/API/MediaTrackConstraints/zoom
       */
      function updateZoomUi() {
        cancelZoomAnimation()
        const vt = localStream?.getVideoTracks?.()[0]
        if (!vt || !zoomSlider) {
          if (zoomSlider) zoomSlider.disabled = true
          paintZoom(NaN)
          return
        }

        const caps = typeof vt.getCapabilities === 'function' ? vt.getCapabilities() : {}
        const zc = caps.zoom
        const hasRange =
          zc &&
          typeof zc === 'object' &&
          typeof zc.min === 'number' &&
          typeof zc.max === 'number' &&
          zc.max > zc.min

        if (!hasRange) {
          zoomSlider.disabled = true
          paintZoom(NaN)
          zoomSlider.title =
            'Zoom por software no disponible aquí (proba Chrome en Android; iPhone suele no exponer zoom en web).'
          return
        }

        zoomSlider.min = String(zc.min)
        zoomSlider.max = String(zc.max)
        zoomSlider.step = String(zc.step != null && zc.step > 0 ? zc.step : Math.max(0.01, (zc.max - zc.min) / 100))

        const settings = typeof vt.getSettings === 'function' ? vt.getSettings() : {}
        let cur = typeof settings.zoom === 'number' ? settings.zoom : zc.min
        cur = Math.min(zc.max, Math.max(zc.min, cur))
        zoomSlider.value = String(cur)
        zoomSlider.disabled = false
        paintZoom(cur)
        zoomSlider.title = `Zoom ${cur.toFixed(2)} · min ${zc.min} · max ${zc.max}`
      }

      /** Objetivo del deslizador; la animación lo alcanza suavizado frame a frame. */
      function setZoomGoalFromSlider(rawValue) {
        if (zoomSlider?.disabled) return
        const v = Number(rawValue)
        if (!Number.isFinite(v)) return
        zoomAnimGoal = v
        if (!zoomRafId) zoomRafId = requestAnimationFrame(zoomAnimationTick)
      }

      function zoomAnimationTick() {
        const gen = zoomAnimGeneration
        const vt = localStream?.getVideoTracks?.()[0]
        if (!vt || zoomAnimGoal == null || !zoomSlider || zoomSlider.disabled) {
          zoomRafId = 0
          return
        }

        const caps = typeof vt.getCapabilities === 'function' ? vt.getCapabilities() : {}
        const zc = caps.zoom
        if (!zc || typeof zc !== 'object' || typeof zc.min !== 'number' || typeof zc.max !== 'number' || zc.max <= zc.min) {
          zoomRafId = 0
          return
        }

        const settings = typeof vt.getSettings === 'function' ? vt.getSettings() : {}
        const cur =
          typeof settings.zoom === 'number' ? settings.zoom : Math.min(zc.max, Math.max(zc.min, zoomAnimGoal))
        const goal = Math.min(zc.max, Math.max(zc.min, zoomAnimGoal))
        const delta = goal - cur
        const threshold = Math.max(0.0008, (zc.max - zc.min) * 0.0004)

        if (Math.abs(delta) <= threshold) {
          void vt
            .applyConstraints({ advanced: [{ zoom: goal }] })
            .then(() => {
              if (gen !== zoomAnimGeneration) return
              const z = vt.getSettings?.()?.zoom
              if (typeof z === 'number' && zoomSlider) {
                zoomSlider.title = `Zoom ${z.toFixed(2)}`
                paintZoom(z)
              }
            })
            .catch(() => {})
          zoomRafId = 0
          return
        }

        const smoothing = 0.26
        const next = Math.min(zc.max, Math.max(zc.min, cur + delta * smoothing))

        void vt
          .applyConstraints({ advanced: [{ zoom: next }] })
          .then(() => {
            if (gen !== zoomAnimGeneration) return
            zoomRafId = requestAnimationFrame(zoomAnimationTick)
          })
          .catch(() => {
            zoomRafId = 0
          })
      }

      let ws
      let cameraId
      let pc
      let localStream
      let isTransmitting = false

      const pendingRemoteIce = []

      function setMainButtonIdle(label) {
        setKeyLabel(btn, label)
        btn.disabled = false
        btn.classList.remove('is-live')
        stage.removeAttribute('data-air')
        setTally('stby', 'Stby')
      }

      function setMainButtonStreaming() {
        setKeyLabel(btn, 'Stop')
        btn.disabled = false
        btn.classList.add('is-live')
        stage.dataset.air = 'live'
        setTally('live', 'Aire')
      }

      function stopTransmission(opts) {
        cancelZoomAnimation()
        try {
          if (pc) {
            pc.getSenders().forEach((s) => {
              try {
                if (s.track) s.track.stop()
              } catch (_) {}
            })
            pc.close()
          }
        } catch (_) {}
        pc = null
        pendingRemoteIce.length = 0

        if (localStream) {
          try {
            localStream.getTracks().forEach((t) => t.stop())
          } catch (_) {}
        }
        localStream = null
        pv.srcObject = null
        splash.classList.remove('hidden')
        torchOn = false
        isTransmitting = false
        camEnv.disabled = true
        camUser.disabled = true
        updateTorchAvailability()
        updateZoomUi()

        setMainButtonIdle('Rec')
        if (!opts || !opts.silent) {
          log('Transmisión detenida. Tocá «Volver a transmitir» para enviar video a la PC otra vez.')
        }

        if (ws && ws.readyState === WebSocket.OPEN) {
          camEnv.disabled = false
          camUser.disabled = false
        }
      }

      function flushRemoteIce() {
        while (pendingRemoteIce.length && pc?.remoteDescription) {
          const c = pendingRemoteIce.shift()
          if (c) pc.addIceCandidate(c).catch(() => {})
        }
      }

      let rotationDebounce = null

      /**
       * Muchos Android no pueden abrir la frontal mientras la trasera sigue en uso.
       * Orden: preset → solo facingMode → exact → probamos cada videoinput por etiqueta/deviceId.
       */
      async function openVideoStreamWithFallbacks() {
        const attempts = [
          async () =>
            navigator.mediaDevices.getUserMedia({
              audio: false,
              video: videoConstraintsFromPreset()
            }),
          async () =>
            navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { facingMode: { ideal: facingModePreference } }
            }),
          async () =>
            navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { facingMode: { exact: facingModePreference } }
            })
        ]

        let lastErr
        for (const run of attempts) {
          try {
            return await run()
          } catch (e) {
            lastErr = e
          }
        }

        try {
          const list = await navigator.mediaDevices.enumerateDevices()
          const inputs = list.filter((d) => d.kind === 'videoinput' && d.deviceId)
          const wantFront = facingModePreference === 'user'
          const ranked = inputs
            .map((d) => {
              const L = (d.label || '').toLowerCase()
              let score = 0
              if (wantFront) {
                if (/front|user|selfie|facial|face/.test(L)) score += 24
                if (/wide|ultra|macro|tele|back|rear|world|environment/.test(L)) score -= 12
              } else {
                if (/back|rear|environment|wide|world|main|photo/.test(L)) score += 24
                if (/front|user|selfie|facial|face/.test(L)) score -= 12
              }
              return { d, score }
            })
            .sort((a, b) => b.score - a.score)

          for (const { d } of ranked) {
            try {
              return await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { deviceId: { exact: d.deviceId } }
              })
            } catch (_) {
              try {
                return await navigator.mediaDevices.getUserMedia({
                  audio: false,
                  video: { deviceId: { ideal: d.deviceId } }
                })
              } catch (_) {}
            }
          }
        } catch (_) {}

        throw lastErr
      }

      /**
       * Sustituye el track de vídeo local (rotación = mismo sensor; facing = liberar cámara antes en Android).
       */
      async function swapLocalVideoTrack(reason) {
        if (!localStream || !pc || !cameraId) {
          if (reason === 'facing') log('Esperá a que termine de iniciar la transmisión y probá de nuevo.')
          return
        }
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          if (reason === 'facing') log('Sin señal al servidor: no se puede cambiar de cámara. Refrescá la página.')
          return
        }

        const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video')
        if (!sender) {
          if (reason === 'facing') log('No se encontró la pista de vídeo WebRTC.')
          return
        }

        let freshStream
        try {
          if (reason === 'facing') {
            const oldVt = localStream.getVideoTracks()[0]
            if (oldVt) {
              oldVt.stop()
              localStream.removeTrack(oldVt)
            }
            await sender.replaceTrack(null).catch(() => {})
            pv.srcObject = localStream
          }

          freshStream = await openVideoStreamWithFallbacks()
        } catch (e) {
          const prefix =
            reason === 'rotation'
              ? 'Rotación: no se pudo volver a abrir la cámara:'
              : 'No se pudo cambiar de cámara:'
          log(prefix + ' ' + (e?.message || e))
          return
        }

        const newVt = freshStream.getVideoTracks()[0]
        if (!newVt) {
          freshStream.getTracks().forEach((t) => t.stop())
          return
        }

        try {
          await sender.replaceTrack(newVt)
        } catch (e) {
          log('replaceTrack:', e?.message || e)
          newVt.stop()
          return
        }

        if (reason === 'rotation') {
          const oldVt = localStream.getVideoTracks()[0]
          if (oldVt) {
            localStream.removeTrack(oldVt)
            oldVt.stop()
          }
        }

        localStream.addTrack(newVt)
        pv.srcObject = localStream
        torchOn = false
        updateTorchAvailability()
        updateZoomUi()

        await applyOutboundVideoBitrateCap(pc)

        try {
          const offer = await pc.createOffer({ iceRestart: true })
          await pc.setLocalDescription(offer)
          ws.send(JSON.stringify({ type: 'offer', cameraId, sdp: pc.localDescription.sdp }))
          if (reason === 'rotation') {
            log('Rotación: cámara nueva enviada a la PC (orientación corregida).')
          } else if (reason === 'facing') {
            log('Cámara frontal/trasera actualizada en la PC.')
          }
        } catch (e) {
          log('Oferta tras cambio de cámara:', e?.message || e)
        }
      }

      /**
       * Muchos celus siguen enviando dimensiones “verticales” en el códec aunque ya filmás horizontal.
       */
      async function refreshVideoAfterRotation() {
        await swapLocalVideoTrack('rotation')
      }

      async function applyFacingChoice(mode) {
        if (mode !== 'environment' && mode !== 'user') return
        facingModePreference = mode
        syncCamPickUi()
        if (!localStream || !pc) return
        camEnv.disabled = true
        camUser.disabled = true
        try {
          await swapLocalVideoTrack('facing')
        } finally {
          camEnv.disabled = false
          camUser.disabled = false
        }
      }

      function onOrientationOrResize() {
        if (rotationDebounce) clearTimeout(rotationDebounce)
        rotationDebounce = setTimeout(() => void refreshVideoAfterRotation(), 500)
      }

      window.addEventListener('orientationchange', onOrientationOrResize)
      window.addEventListener('resize', onOrientationOrResize)
      if (typeof screen !== 'undefined' && screen.orientation?.addEventListener) {
        screen.orientation.addEventListener('change', onOrientationOrResize)
      }

      async function startCamera() {
        if (!cameraId) {
          log('Esperando ID del estudio… probá de nuevo en un segundo.')
          return
        }
        ensureMediaDevicesShim()
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
          throw new Error(
            'Tu navegador no expone la cámara aquí. Abrí esta misma página en Chrome (Android) o Safari (iPhone), no dentro de WhatsApp o Facebook (tocá ⋮ → Abrir en navegador).'
          )
        }
        if (!checkSecureCameraContext()) {
          throw new Error(
            'La página debe abrirse con HTTPS (la URL debe empezar con https:// como muestra la PC). Si ves http:// o un aviso de sitio no seguro distinto al certificado LAN, corregí la dirección.'
          )
        }
        btn.disabled = true
        const stream = await openVideoStreamWithFallbacks()
        pv.srcObject = stream
        localStream = stream
        splash.classList.add('hidden')
        syncCamPickUi()
        updateTorchAvailability()
        updateZoomUi()

        pc = new RTCPeerConnection(rtcConfig)
        stream.getTracks().forEach((t) => pc.addTrack(t, stream))
        preferPassthroughCodecs(pc)
        await applyOutboundVideoBitrateCap(pc)

        pc.onicecandidate = (ev) => {
          if (!cameraId) return
          ws.send(JSON.stringify({ type: 'ice', cameraId, candidate: ev.candidate?.toJSON() ?? null }))
        }

        pc.onconnectionstatechange = () => log('Estado WebRTC:', pc.connectionState)

        const offer = await pc.createOffer()
        await pc.setLocalDescription(offer)
        ws.send(JSON.stringify({ type: 'offer', cameraId, sdp: pc.localDescription.sdp }))

        /* Pantalla completa del sistema justo después del gesto del usuario */
        await tryEnterFullscreen()
      }

      fsBtn.addEventListener('click', () => {
        void tryEnterFullscreen()
      })

      function connectWs() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
        ws = new WebSocket(`${proto}//${location.host}`)

        ws.onopen = () => {
          const wsMode = studioWorkspaceFromSearch()
          ws.send(
            JSON.stringify({
              type: 'register',
              role: 'camera',
              name: navigator.userAgent,
              workspace: wsMode
            })
          )
          const pr = new URLSearchParams(location.search).get('preset') || 'medium'
          ensureMediaDevicesShim()
          const hasGum =
            navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function'
          const secure = checkSecureCameraContext()

          if (!secure) {
            btn.disabled = true
            setKeyLabel(btn, 'Https')
            setTally('fault', 'Https')
            camEnv.disabled = true
            camUser.disabled = true
            log(
              'Sin contexto seguro para la cámara. Copiá la URL que muestra la PC (debe empezar con https://). No uses http:// ni enlaces abiertos desde WhatsApp/Facebook sin Abrir en Chrome/Safari.'
            )
            return
          }
          if (!hasGum) {
            btn.disabled = true
            setKeyLabel(btn, 'N/A')
            setTally('fault', 'Nav')
            camEnv.disabled = true
            camUser.disabled = true
            log(
              'Este navegador no permite getUserMedia. Abrí la página en Chrome actualizado (Android) o Safari (iPhone).'
            )
            return
          }

          btn.disabled = false
          setKeyLabel(btn, 'Rec')
          setTally('stby', 'Stby')
          camEnv.disabled = false
          camUser.disabled = false
          log(
            'Listo. Preset:',
            pr,
            '· modo PC:',
            wsMode === 'liveFusion' ? 'Fusión en vivo' : 'Sesión en vivo',
            '. Tocá Transmitir — la cámara irá a pantalla completa.'
          )
        }

        ws.onmessage = async (ev) => {
          const msg = JSON.parse(ev.data)

          if (msg.type === 'host-ready') {
            if (!pc || !cameraId) return
            if (pc.connectionState === 'connected' || pc.connectionState === 'connecting') return
            try {
              const offer = await pc.createOffer({ iceRestart: true })
              await pc.setLocalDescription(offer)
              ws.send(JSON.stringify({ type: 'offer', cameraId, sdp: pc.localDescription.sdp }))
              log('La PC está lista; renegociando video…')
            } catch (e) {
              log('Renegociación WebRTC:', e?.message || e)
            }
            return
          }

          if (msg.type === 'registered') {
            cameraId = msg.cameraId
            return
          }

          if (msg.type === 'answer') {
            if (!pc) return
            await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp })
            flushRemoteIce()
            return
          }

          if (msg.type === 'keyframe') {
            void forceKeyframe(pc)
            return
          }

          if (msg.type === 'ice') {
            if (!msg.candidate) return
            const c = new RTCIceCandidate(msg.candidate)
            if (!pc?.remoteDescription) {
              pendingRemoteIce.push(c)
              return
            }
            await pc.addIceCandidate(c).catch(() => {})
          }
        }

        ws.onclose = () => {
          if (isTransmitting) stopTransmission({ silent: true })
          setTally('fault', 'Sync')
          log('Señalización cerrada. Refrescá la página para volver a conectar.')
        }

        ws.onerror = () => log('Error de red / WebSocket.')
      }

      btn.addEventListener('click', async () => {
        if (isTransmitting) {
          stopTransmission()
          return
        }
        try {
          await startCamera()
          isTransmitting = true
          setMainButtonStreaming()
        } catch (e) {
          log('No se pudo usar la cámara:', e?.message || e)
          isTransmitting = false
          setMainButtonIdle('Rec')
        }
      })

      camEnv.addEventListener('click', () => void applyFacingChoice('environment'))
      camUser.addEventListener('click', () => void applyFacingChoice('user'))
      torchBtn.addEventListener('click', () => void setTorch(!torchOn))

      zoomSlider.addEventListener('input', (e) => {
        paintZoom(e.target.value)
        setZoomGoalFromSlider(e.target.value)
      })

      connectWs()
    </script>
  </body>
</html>
